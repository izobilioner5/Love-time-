name: SOULUME EP05 Final Build

on:
  push:
    paths:
      - '.github/workflows/soulume-ep05-final-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download six verified 10-minute parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          urls=(
            "https://gcdn.picsart.com/media-engine/e54f5d1f-a74a-4dc2-bdee-dd51e3faf42f.mp4"
            "https://gcdn.picsart.com/media-engine/f9b2cc75-1164-478f-95e5-a6ef94f8d4b8.mp4"
            "https://gcdn.picsart.com/media-engine/c3c89caf-3015-4fe5-b599-48b0e88737fa.mp4"
            "https://gcdn.picsart.com/media-engine/3ff944d6-0cc7-4080-8931-992f49671e3b.mp4"
            "https://gcdn.picsart.com/media-engine/2ab0e4ff-2406-49da-9bde-f5262f6f0df8.mp4"
            "https://gcdn.picsart.com/media-engine/9ad62f2d-ea0f-4088-b971-f3cc38339915.mp4"
          )
          i=1
          for url in "${urls[@]}"; do
            printf -v n "%02d" "$i"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 "$url" -o "media/$n.mp4"
            d=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "media/$n.mp4")
            echo "Part $n duration: $d"
            awk -v d="$d" 'BEGIN{if(d<599 || d>601) exit 1}'
            i=$((i+1))
          done

      - name: Concatenate to one 60-minute MP4
        shell: bash
        run: |
          set -euo pipefail
          : > concat.txt
          for f in media/*.mp4; do printf "file '%s'\n" "$PWD/$f" >> concat.txt; done
          ffmpeg -y -f concat -safe 0 -i concat.txt -map 0:v:0 -map 0:a:0 -c copy -t 3600 -movflags +faststart SOULUME_EP05_JAPAN_1H_FINAL.mp4

      - name: Final QA
        shell: bash
        run: |
          set -euo pipefail
          duration=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 SOULUME_EP05_JAPAN_1H_FINAL.mp4)
          video=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 SOULUME_EP05_JAPAN_1H_FINAL.mp4)
          audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 SOULUME_EP05_JAPAN_1H_FINAL.mp4)
          echo "duration=$duration" | tee qa.txt
          echo "video=$video" | tee -a qa.txt
          echo "audio=$audio" | tee -a qa.txt
          awk -v d="$duration" 'BEGIN{if(d<3598 || d>3602) exit 1}'
          test -s SOULUME_EP05_JAPAN_1H_FINAL.mp4
          echo "QA PASS" | tee -a qa.txt

      - name: Publish final master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="soulume-ep05-japan-final"
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" SOULUME_EP05_JAPAN_1H_FINAL.mp4 qa.txt             --repo "$GITHUB_REPOSITORY"             --title "SOULUME 05 — JAPAN — 1H FINAL"             --notes "Final production master for SOULUME Episode 05 — Japan."
