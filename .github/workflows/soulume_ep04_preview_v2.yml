name: SOULUME Episode 04 Preview V2

on:
  push:
    branches:
      - soulume-ep04-preview-v2
    paths:
      - .github/workflows/soulume_ep04_preview_v2.yml

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl unzip

      - name: Download final master and make review preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=35743546722
          arts=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")
          aid=$(printf '%s' "$arts" | python3 -c 'import sys,json; d=json.load(sys.stdin); xs=[a for a in d["artifacts"] if a["name"]=="SOULUME_EP04_NEW_ZEALAND_5H55M55S"]; print(xs[0]["id"] if xs else "")')
          [ -n "$aid" ] || { echo "Master artifact not found"; exit 1; }
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" -o master.zip
          mkdir master out
          unzip -q master.zip -d master
          src=$(find master -type f -name 'SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4' | head -n1)
          [ -n "$src" ] || exit 1

          # 3-minute sample centered near the middle. Re-encode to a lightweight 720p review file.
          # Loudness target for YouTube review: -14 LUFS integrated, true peak <= -1.5 dBTP.
          ffmpeg -hide_banner -y -ss 02:56:30 -i "$src" -t 180             -vf "scale=-2:720"             -c:v libx264 -preset veryfast -crf 27 -r 24             -c:a aac -b:a 192k -ar 48000             -af "loudnorm=I=-14:LRA=11:TP=-1.5"             -movflags +faststart out/SOULUME_EP04_MIDDLE_REVIEW_3MIN_720P.mp4

          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,sample_rate,channels:format=duration,size -of json             out/SOULUME_EP04_MIDDLE_REVIEW_3MIN_720P.mp4 > out/ffprobe.json
          ffmpeg -hide_banner -i out/SOULUME_EP04_MIDDLE_REVIEW_3MIN_720P.mp4             -af loudnorm=I=-14:LRA=11:TP=-1.5:print_format=summary -f null - 2> out/loudness.txt || true
          cat out/ffprobe.json
          tail -30 out/loudness.txt

      - name: Upload review preview
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_MIDDLE_REVIEW_3MIN_720P
          path: |
            out/SOULUME_EP04_MIDDLE_REVIEW_3MIN_720P.mp4
            out/ffprobe.json
            out/loudness.txt
          compression-level: 0
          retention-days: 3
