name: SOULUME Episode 04 Full Render

on:
  push:
    branches:
      - soulume-ep04-render
    paths:
      - .github/workflows/soulume_ep04_render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tools
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          mkdir -p work/images work/clips work/notes out

      - name: Download open handwritten font
        run: |
          curl -L --fail --retry 3 "https://github.com/google/fonts/raw/main/ofl/caveat/Caveat%5Bwght%5D.ttf" -o work/Caveat.ttf
          test -s work/Caveat.ttf

      - name: Download visual sources
        shell: bash
        run: |
          set -euo pipefail
          urls=(
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0e41a29e-6d08-448c-acb5-d3fea847cd5c.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/434436fb-066e-459d-a0d1-28283024a166.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/39ce7b9d-e515-45aa-8f97-99190f95a976.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/59b772a5-07ee-437e-8e81-10ef6b0446f5.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/caa1d408-1253-4ba2-b501-753d0fe39391.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/6b5f1b33-b2bf-42a3-91fb-e50a33a5b94a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/60ba2c2e-8165-4d6a-8448-c9671fea5a1e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/09fe50b1-f95b-43c2-991b-b863be887f0d.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/787847e3-acff-4af1-8fa2-637d13313db0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e69c60c3-0d27-42d6-93ac-eb125efddb24.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e9f580e9-99ea-4d5b-90f1-2e5b885ebb87.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5057cea3-da5d-4fc5-880d-a2baffa0cf53.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcb3654a-5c1e-4a8f-82d0-6a1343ecccd3.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/655dcd75-3fb4-43a3-b8a6-c5ecedfcbede.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/20e68842-f55d-45f4-8441-1340e93544c8.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/9c884ad0-4946-4619-9bae-35f9a9f19485.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcbfac25-6e90-4f4e-8d47-a7ce5aea63f6.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/28140912-a731-40e2-9c78-a38d5f14b7af.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c679bcbd-334c-4899-a23b-faadb68f417a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/61407139-c615-4c76-9dcb-a3913349f6d9.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5cfb6402-fc93-4bd7-83b8-b1a18f9177a0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5f6a3fda-3d96-4ee1-ab3d-38e1ded3590e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/f6730e47-441d-4ad6-bbff-16f8137999b7.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0154d010-11db-40ac-8965-d73363e19b6b.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/807525a9-eb3f-4260-b3f8-e526999fab49.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/ad20f085-3e43-4b1c-bd17-cbedb17ff0b2.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c02771d4-055c-41c3-947a-1c5ed8498e34.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/d98a9f50-151a-41c3-80f7-2f7cce356420.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/285a4147-0d25-48d4-9311-f6b59f4b4521.jpg"
          "https://images.pexels.com/photos/36620443/pexels-photo-36620443.jpeg?cs=srgb&dl=pexels-eclipse-chasers-716719984-36620443.jpg&fm=jpg"
          "https://images.pexels.com/photos/19733325/pexels-photo-19733325.jpeg?cs=srgb&dl=pexels-andromeda99-19733325.jpg&fm=jpg"
          "https://images.pexels.com/photos/20066249/pexels-photo-20066249.jpeg"
          )
          i=0
          for u in "${urls[@]}"; do
            printf -v fn "work/images/%02d.jpg" "$i"
            curl -L --fail --retry 3 "$u" -o "$fn"
            test -s "$fn"
            i=$((i+1))
          done
          echo "Downloaded $i images"

      - name: Download SOULUME music
        shell: bash
        run: |
          set -euo pipefail
          music=(
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_cbaf0946a21a2c31/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T134919Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_562c7c3d51587923/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135020Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_d6e9a419f9a1081c/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135058Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_a7664a20c5d671c5/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135240Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_fc8f91c242b68fe6/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135335Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          )
          i=0
          for u in "${music[@]}"; do
            printf -v fn "work/music_%02d.mp3" "$i"
            curl -L --fail --retry 3 "$u" -o "$fn"
            test -s "$fn"
            i=$((i+1))
          done

      - name: Make 15-minute music master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y             -i work/music_00.mp3 -i work/music_01.mp3 -i work/music_02.mp3 -i work/music_03.mp3 -i work/music_04.mp3             -filter_complex "[0:a]loudnorm=I=-20:TP=-2:LRA=10[a0];[1:a]loudnorm=I=-20:TP=-2:LRA=10[a1];[2:a]loudnorm=I=-20:TP=-2:LRA=10[a2];[3:a]loudnorm=I=-20:TP=-2:LRA=10[a3];[4:a]loudnorm=I=-20:TP=-2:LRA=10[a4];[a0][a1]acrossfade=d=3:c1=tri:c2=tri[b1];[b1][a2]acrossfade=d=3:c1=tri:c2=tri[b2];[b2][a3]acrossfade=d=3:c1=tri:c2=tri[b3];[b3][a4]acrossfade=d=3:c1=tri:c2=tri[a]"             -map "[a]" -c:a aac -b:a 128k work/music_master.m4a
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 work/music_master.m4a

      - name: Render reusable moving visual clips
        shell: bash
        run: |
          set -euo pipefail
          FONT_SANS="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
          render_one () {
            i="$1"
            printf -v img "work/images/%02d.jpg" "$i"
            printf -v out "work/clips/base_%02d.mp4" "$i"
            mode=$((i % 4))
            if [ "$mode" -eq 0 ]; then
              X="(in_w-out_w)*n/1439"; Y="(in_h-out_h)/2"
            elif [ "$mode" -eq 1 ]; then
              X="(in_w-out_w)*(1-n/1439)"; Y="(in_h-out_h)/2"
            elif [ "$mode" -eq 2 ]; then
              X="(in_w-out_w)/2"; Y="(in_h-out_h)*n/1439"
            else
              X="(in_w-out_w)/2"; Y="(in_h-out_h)*(1-n/1439)"
            fi
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60               -vf "scale=1408:792:force_original_aspect_ratio=increase,crop=1280:720:x='${X}':y='${Y}',eq=saturation=1.05:contrast=1.02,drawtext=fontfile='${FONT_SANS}':text='SOULUME':fontcolor=white@0.78:fontsize=25:x=w-tw-38:y=30,drawtext=fontfile='${FONT_SANS}':text='NEW ZEALAND · EPISODE 04':fontcolor=white@0.72:fontsize=13:x=w-tw-38:y=64,drawtext=fontfile='${FONT_SCRIPT}':text='S.':fontcolor=white@0.78:fontsize=30:x=w-tw-38:y=91,format=yuv420p"               -an -c:v libx264 -preset veryfast -crf 30 -maxrate 600k -bufsize 1200k -g 24 -keyint_min 24 -sc_threshold 0 -r 24 "$out"
          }
          export -f render_one
          export GITHUB_WORKSPACE
          seq 0 31 | xargs -n1 -P2 bash -c 'render_one "$0"'
          test "$(find work/clips -name 'base_*.mp4' | wc -l)" -eq 32

      - name: Render handwritten-note variants
        shell: bash
        run: |
          set -euo pipefail
          FONT_SANS="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
          cat > work/notes.txt <<'EOF'
          I didn't expect the road to feel this quiet.
          Some places make you breathe differently.
          I stopped trying to photograph everything.
          Maybe beauty needs less explanation.
          The lake looked unreal. It wasn't.
          I stayed longer than I planned.
          The rain made the town feel softer.
          There is no rush here.
          I think I needed this silence.
          The road kept opening.
          Today felt bigger than a photograph.
          I forgot to check the time.
          Mountains make small thoughts disappear.
          I wanted to remember the air.
          Nothing was asking me to hurry.
          I kept driving.
          The light changed everything.
          This place feels like a secret.
          I listened more than I spoke.
          The weather changed. So did I.
          I didn't need a destination today.
          Some views don't fit inside a camera.
          I think the quiet followed me.
          One more road before sunset.
          EOF
          mapfile -t notes < work/notes.txt
          for j in $(seq 0 23); do
            imgidx=$(( (j*7 + 3) % 32 ))
            printf -v img "work/images/%02d.jpg" "$imgidx"
            printf -v out "work/notes/note_%02d.mp4" "$j"
            txt="${notes[$j]}"
            safe_txt=$(printf '%s' "$txt" | sed "s/'/\\\\'/g; s/:/\\\\:/g")
            if [ $((j%2)) -eq 0 ]; then
              NX=46; NY=610
            else
              NX=46; NY=84
            fi
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60               -vf "scale=1408:792:force_original_aspect_ratio=increase,crop=1280:720:x='(in_w-out_w)*n/1439':y='(in_h-out_h)/2',eq=saturation=1.05:contrast=1.02,drawtext=fontfile='${FONT_SANS}':text='SOULUME':fontcolor=white@0.78:fontsize=25:x=w-tw-38:y=30,drawtext=fontfile='${FONT_SANS}':text='NEW ZEALAND · EPISODE 04':fontcolor=white@0.72:fontsize=13:x=w-tw-38:y=64,drawtext=fontfile='${FONT_SCRIPT}':text='S.':fontcolor=white@0.78:fontsize=30:x=w-tw-38:y=91,drawtext=fontfile='${FONT_SCRIPT}':text='${safe_txt}':fontcolor=white@0.86:fontsize=38:x=${NX}:y=${NY}:enable='between(t,23,37)':alpha='if(lt(t,24),(t-23),if(gt(t,36),(37-t),1))',format=yuv420p"               -an -c:v libx264 -preset veryfast -crf 30 -maxrate 600k -bufsize 1200k -g 24 -keyint_min 24 -sc_threshold 0 -r 24 "$out"
          done

      - name: Build exact 5h55m55s visual sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import random
          random.seed(404)
          total_full = 355
          note_slots = {14 + 15*k: k for k in range(23)}
          note_slots[344] = 23
          items=[]
          bag=list(range(32))
          last=None
          for slot in range(total_full):
              if slot in note_slots:
                  items.append(f"work/notes/note_{note_slots[slot]:02d}.mp4")
                  continue
              if not bag:
                  bag=list(range(32))
                  random.shuffle(bag)
              if last is not None and bag and bag[-1]==last:
                  bag[-1],bag[0]=bag[0],bag[-1]
              idx=bag.pop()
              last=idx
              items.append(f"work/clips/base_{idx:02d}.mp4")
          with open("work/sequence.txt","w") as f:
              for p in items:
                  f.write(f"file '{p.split('work/',1)[1]}'\n")
          PY
          cd work
          ffmpeg -hide_banner -loglevel error -y -i clips/base_00.mp4 -t 55 -c copy last55.mp4
          echo "file 'last55.mp4'" >> sequence.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i sequence.txt -c copy video_5h55m55s.mp4
          cd ..
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 work/video_5h55m55s.mp4)
          echo "Visual duration: $DUR"

      - name: Mux final audio and verify
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i work/video_5h55m55s.mp4 -stream_loop -1 -i work/music_master.m4a             -t 21355 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 96k             -movflags +faststart -shortest out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4

          ffmpeg -hide_banner -loglevel error -y -i out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 -t 60 -c copy out/SOULUME_EP04_PREVIEW_60S.mp4

          ffprobe -v error -show_streams -show_format -of json out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > out/ffprobe.json
          python3 - <<'PY'
          import json, os, sys
          p="out/ffprobe.json"
          d=json.load(open(p))
          dur=float(d["format"]["duration"])
          streams=d["streams"]
          v=[s for s in streams if s["codec_type"]=="video"]
          a=[s for s in streams if s["codec_type"]=="audio"]
          assert abs(dur-21355) < 1.1, dur
          assert v and a, "missing video or audio"
          assert int(v[0]["width"])==1280 and int(v[0]["height"])==720
          size=os.path.getsize("out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4")
          print("VERIFIED duration",dur,"size",size,"video",v[0]["codec_name"],"audio",a[0]["codec_name"])
          PY
          sha256sum out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > out/SHA256.txt
          ls -lh out/

      - name: Upload 60-second preview
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_PREVIEW_60S
          path: out/SOULUME_EP04_PREVIEW_60S.mp4
          compression-level: 0
          retention-days: 3

      - name: Upload verified full master
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_NEW_ZEALAND_5H55M55S
          path: |
            out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4
            out/ffprobe.json
            out/SHA256.txt
          compression-level: 0
          retention-days: 3
\n# trigger: 2026-09-22 autonomous render v2\n