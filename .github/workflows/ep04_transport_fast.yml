name: SOULUME EP04 Fast Lossless Transport

on:
  push:
    branches: [soulume-ep04-render]
    paths:
      - .github/workflows/ep04_transport_fast.yml

permissions:
  contents: write
  actions: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify ffmpeg preinstalled
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Download verified final master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work parts
          curl -L --fail --retry 5             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10708300363/zip"             -o work/final.zip
          unzip -p work/final.zip SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > work/master.mp4
          echo "a9d97981a49fb4b482f22562927e2224ed6cf44068d2faadcef3bece677b5049  work/master.mp4" | sha256sum -c -

      - name: Split into valid 30m MP4 segments without re-encoding
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i work/master.mp4             -map 0:v:0 -map 0:a:0 -c copy             -f segment -segment_time 1800 -reset_timestamps 1             parts/EP04_SEG_%02d.mp4
          python3 - <<'PY'
          import glob,subprocess,json,os
          fs=sorted(glob.glob("parts/EP04_SEG_*.mp4"))
          assert len(fs)>=11, len(fs)
          total=0.0
          for p in fs:
              d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-show_entries","stream=codec_type,width,height","-of","json",p],text=True))
              dur=float(d["format"]["duration"]); total+=dur
              v=next(s for s in d["streams"] if s["codec_type"]=="video")
              assert int(v["width"])==3840 and int(v["height"])==2160
              print(os.path.basename(p),dur,os.path.getsize(p))
          print("TOTAL",total)
          assert abs(total-21355)<5,total
          PY

      - name: Publish temporary transport release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="soulume-ep04-transport-fast"
          gh release delete "$TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" parts/EP04_SEG_*.mp4             --title "SOULUME EP04 fast transport"             --notes "Temporary lossless transport segments from verified EP04 4K master. Numeric order. Source SHA256 a9d97981a49fb4b482f22562927e2224ed6cf44068d2faadcef3bece677b5049."             --prerelease
