name: SOULUME EP04 Final Local-FFmpeg Render

on:
  push:
    branches:
      - soulume-ep04-render
    paths:
      - .github/workflows/soulume_ep04_final.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/images work/clips work/notes out
          curl -L --fail --retry 4 "https://github.com/google/fonts/raw/main/ofl/caveat/Caveat%5Bwght%5D.ttf" -o work/Caveat.ttf
          test -s work/Caveat.ttf

      - name: Download visuals
        shell: bash
        run: |
          set -euo pipefail
          urls=(
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0e41a29e-6d08-448c-acb5-d3fea847cd5c.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/39ce7b9d-e515-45aa-8f97-99190f95a976.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/caa1d408-1253-4ba2-b501-753d0fe39391.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/60ba2c2e-8165-4d6a-8448-c9671fea5a1e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/09fe50b1-f95b-43c2-991b-b863be887f0d.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/787847e3-acff-4af1-8fa2-637d13313db0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e69c60c3-0d27-42d6-93ac-eb125efddb24.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e9f580e9-99ea-4d5b-90f1-2e5b885ebb87.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5057cea3-da5d-4fc5-880d-a2baffa0cf53.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcb3654a-5c1e-4a8f-82d0-6a1343ecccd3.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/655dcd75-3fb4-43a3-b8a6-c5ecedfcbede.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/20e68842-f55d-45f4-8441-1340e93544c8.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/9c884ad0-4946-4619-9bae-35f9a9f19485.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcbfac25-6e90-4f4e-8d47-a7ce5aea63f6.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5cfb6402-fc93-4bd7-83b8-b1a18f9177a0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/f6730e47-441d-4ad6-bbff-16f8137999b7.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0154d010-11db-40ac-8965-d73363e19b6b.jpg"
          "https://images.pexels.com/photos/36620443/pexels-photo-36620443.jpeg?cs=srgb&dl=pexels-eclipse-chasers-716719984-36620443.jpg&fm=jpg"
          "https://images.pexels.com/photos/19733325/pexels-photo-19733325.jpeg?cs=srgb&dl=pexels-andromeda99-19733325.jpg&fm=jpg"
          "https://images.pexels.com/photos/20066249/pexels-photo-20066249.jpeg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5f6a3fda-3d96-4ee1-ab3d-38e1ded3590e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/434436fb-066e-459d-a0d1-28283024a166.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/59b772a5-07ee-437e-8e81-10ef6b0446f5.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/6b5f1b33-b2bf-42a3-91fb-e50a33a5b94a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/28140912-a731-40e2-9c78-a38d5f14b7af.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c679bcbd-334c-4899-a23b-faadb68f417a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/807525a9-eb3f-4260-b3f8-e526999fab49.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/ad20f085-3e43-4b1c-bd17-cbedb17ff0b2.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c02771d4-055c-41c3-947a-1c5ed8498e34.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/d98a9f50-151a-41c3-80f7-2f7cce356420.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/285a4147-0d25-48d4-9311-f6b59f4b4521.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5057cea3-da5d-4fc5-880d-a2baffa0cf53.jpg"
          )
          i=0
          for u in "${urls[@]}"; do
            printf -v f "work/images/%02d.jpg" "$i"
            curl -L --fail --retry 4 --retry-delay 1 "$u" -o "$f"
            test -s "$f"
            i=$((i+1))
          done
          echo "visuals=$i"

      - name: Build stable music master from approved pilots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/music_src
          urls=(
          "https://gcdn.picsart.com/media-engine/85fe0cbc-8927-476c-989a-fc923271bd2d.mp4"
          "https://gcdn.picsart.com/media-engine/bedfa653-3b00-4e36-8dff-62c9e8374d3b.mp4"
          "https://gcdn.picsart.com/media-engine/0b68392b-1b3c-4822-afcb-7f32c4489fb5.mp4"
          "https://gcdn.picsart.com/media-engine/a641ec17-ec0b-4ca5-a680-e4c3590f2943.mp4"
          "https://gcdn.picsart.com/media-engine/6335dabf-cd71-4527-a7aa-755e4e6fc65f.mp4"
          "https://gcdn.picsart.com/media-engine/11274e87-e3e1-4e51-92c8-1b3de01cc7f5.mp4"
          )
          i=0
          for u in "${urls[@]}"; do
            printf -v v "work/music_src/pilot_%02d.mp4" "$i"
            printf -v a "work/music_src/audio_%02d.m4a" "$i"
            curl -L --fail --retry 4 --retry-delay 1 "$u" -o "$v"
            ffmpeg -hide_banner -loglevel error -y -i "$v" -vn -c:a aac -b:a 128k "$a"
            test -s "$a"
            i=$((i+1))
          done
          : > work/music_list.txt
          for a in work/music_src/audio_*.m4a; do echo "file '$GITHUB_WORKSPACE/$a'" >> work/music_list.txt; done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i work/music_list.txt -c:a aac -b:a 112k work/music_master.m4a
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 work/music_master.m4a

      - name: Make natural moving clips
        shell: bash
        run: |
          set -euo pipefail
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
          cat > work/render_one.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          i="$1"
          printf -v img "work/images/%02d.jpg" "$i"
          printf -v out "work/clips/base_%02d.mp4" "$i"
          case $((i%4)) in
            0) X="(in_w-out_w)*n/1439"; Y="(in_h-out_h)/2";;
            1) X="(in_w-out_w)*(1-n/1439)"; Y="(in_h-out_h)/2";;
            2) X="(in_w-out_w)/2"; Y="(in_h-out_h)*n/1439";;
            3) X="(in_w-out_w)/2"; Y="(in_h-out_h)*(1-n/1439)";;
          esac
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60             -vf "scale=1408:792:force_original_aspect_ratio=increase,crop=1280:720:x='${X}':y='${Y}',eq=saturation=1.03:contrast=1.01:brightness=0.005,drawtext=fontfile='${FONT}':text='SOULUME':fontcolor=white@0.76:fontsize=25:x=w-tw-38:y=28,drawtext=fontfile='${FONT}':text='NEW ZEALAND  EPISODE 04':fontcolor=white@0.70:fontsize=13:x=w-tw-38:y=61,drawtext=fontfile='${SCRIPT}':text='S.':fontcolor=white@0.78:fontsize=31:x=w-tw-38:y=86,format=yuv420p"             -an -c:v libx264 -preset ultrafast -crf 31 -maxrate 520k -bufsize 1040k -g 48 -r 24 "$out"
          EOS
          chmod +x work/render_one.sh
          export FONT SCRIPT
          seq 0 31 | xargs -n1 -P4 work/render_one.sh
          test "$(find work/clips -name 'base_*.mp4' | wc -l)" -eq 32

      - name: Make note clips
        shell: bash
        run: |
          set -euo pipefail
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
          cat > work/notes.txt <<'EOF'
          I did not expect the road to feel this quiet
          Some places make you breathe differently
          I stopped trying to photograph everything
          Maybe beauty needs less explanation
          The lake looked unreal
          I stayed longer than I planned
          The rain made the town feel softer
          There is no rush here
          I think I needed this silence
          The road kept opening
          Today felt bigger than a photograph
          I forgot to check the time
          Mountains make small thoughts disappear
          I wanted to remember the air
          Nothing was asking me to hurry
          I kept driving
          The light changed everything
          This place feels like a secret
          I listened more than I spoke
          The weather changed and so did I
          I did not need a destination today
          Some views do not fit inside a camera
          I think the quiet followed me
          One more road before sunset
          EOF
          n=0
          while IFS= read -r line; do
            imgidx=$(( (n*11 + 5) % 32 ))
            printf -v img "work/images/%02d.jpg" "$imgidx"
            printf -v note "work/note_%02d.txt" "$n"
            printf -v out "work/notes/note_%02d.mp4" "$n"
            printf "%s" "$line" > "$note"
            if [ $((n%2)) -eq 0 ]; then Y=610; else Y=90; fi
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60               -vf "scale=1408:792:force_original_aspect_ratio=increase,crop=1280:720:x='(in_w-out_w)*n/1439':y='(in_h-out_h)/2',eq=saturation=1.03:contrast=1.01:brightness=0.005,drawtext=fontfile='${FONT}':text='SOULUME':fontcolor=white@0.76:fontsize=25:x=w-tw-38:y=28,drawtext=fontfile='${FONT}':text='NEW ZEALAND  EPISODE 04':fontcolor=white@0.70:fontsize=13:x=w-tw-38:y=61,drawtext=fontfile='${SCRIPT}':text='S.':fontcolor=white@0.78:fontsize=31:x=w-tw-38:y=86,drawtext=fontfile='${SCRIPT}':textfile='${note}':fontcolor=white@0.88:fontsize=38:x=46:y=${Y}:enable='between(t,23,37)':alpha='if(lt(t,24),t-23,if(gt(t,36),37-t,1))',format=yuv420p"               -an -c:v libx264 -preset ultrafast -crf 31 -maxrate 520k -bufsize 1040k -g 48 -r 24 "$out"
            n=$((n+1))
          done < work/notes.txt
          test "$(find work/notes -name 'note_*.mp4' | wc -l)" -eq 24

      - name: Assemble exact 5h55m55s
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import random, os
          random.seed(404)
          slots=355
          note_slots={14+15*k:k for k in range(23)}
          note_slots[344]=23
          pool=list(range(32))
          seq=[]
          bag=[]
          last=None
          for s in range(slots):
              if s in note_slots:
                  seq.append(f"notes/note_{note_slots[s]:02d}.mp4")
                  continue
              if not bag:
                  bag=pool[:]
                  random.shuffle(bag)
              idx=bag.pop()
              if idx==last and bag:
                  j=bag.pop(); bag.append(idx); idx=j
              last=idx
              seq.append(f"clips/base_{idx:02d}.mp4")
          with open("work/sequence.txt","w") as f:
              for p in seq: f.write("file '"+p+"'\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -i work/clips/base_00.mp4 -t 55 -c copy work/last55.mp4
          echo "file 'last55.mp4'" >> work/sequence.txt
          (cd work && ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i sequence.txt -c copy video_5h55m55s.mp4)

      - name: Add music and verify final
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i work/video_5h55m55s.mp4 -stream_loop -1 -i work/music_master.m4a             -t 21355 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 96k             -movflags +faststart -shortest out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4

          ffmpeg -hide_banner -loglevel error -y -i out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 -t 60 -c copy out/SOULUME_EP04_PREVIEW_60S.mp4
          ffprobe -v error -show_streams -show_format -of json out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > out/ffprobe.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("out/ffprobe.json"))
          dur=float(d["format"]["duration"])
          streams=d["streams"]
          assert abs(dur-21355)<1.1, dur
          assert any(s["codec_type"]=="video" for s in streams)
          assert any(s["codec_type"]=="audio" for s in streams)
          v=next(s for s in streams if s["codec_type"]=="video")
          assert int(v["width"])==1280 and int(v["height"])==720
          print("VERIFIED",dur,os.path.getsize("out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4"))
          PY
          sha256sum out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > out/SHA256.txt

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_PREVIEW_60S
          path: out/SOULUME_EP04_PREVIEW_60S.mp4
          compression-level: 0
          retention-days: 1

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_NEW_ZEALAND_5H55M55S
          path: |
            out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4
            out/ffprobe.json
            out/SHA256.txt
          compression-level: 0
          retention-days: 1
