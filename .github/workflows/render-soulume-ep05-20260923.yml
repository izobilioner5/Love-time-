name: Render SOULUME EP05 Japan

on:
  push:
    paths:
      - '.github/workflows/render-soulume-ep05-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download approved thumbnail
        run: |
          curl -L --fail --retry 5 'https://at.adobe.com/aJJrCvnYohdSwHs1' -o SOULUME_EP05_JAPAN_THUMB.png
          file SOULUME_EP05_JAPAN_THUMB.png
          test -s SOULUME_EP05_JAPAN_THUMB.png

      - name: Download rendered 10-minute chapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/e54f5d1f-a74a-4dc2-bdee-dd51e3faf42f.mp4' -o media/01.mp4
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/f9b2cc75-1164-478f-95e5-a6ef94f8d4b8.mp4' -o media/02.mp4
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/c3c89caf-3015-4fe5-b599-48b0e88737fa.mp4' -o media/03.mp4
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/3ff944d6-0cc7-4080-8931-992f49671e3b.mp4' -o media/04.mp4
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/2ab0e4ff-2406-49da-9bde-f5262f6f0df8.mp4' -o media/05.mp4
          curl -L --fail --retry 5 'https://gcdn.picsart.com/media-engine/9ad62f2d-ea0f-4088-b971-f3cc38339915.mp4' -o media/06.mp4
          for f in media/*.mp4; do
            ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$f"
          done

      - name: Concatenate exact one-hour master
        shell: bash
        run: |
          set -euo pipefail
          printf "file '%s'\n" "$PWD/media/01.mp4" "$PWD/media/02.mp4" "$PWD/media/03.mp4" "$PWD/media/04.mp4" "$PWD/media/05.mp4" "$PWD/media/06.mp4" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart SOULUME_EP05_JAPAN_1H_FINAL.mp4

      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format SOULUME_EP05_JAPAN_1H_FINAL.mp4 > qa.txt
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 SOULUME_EP05_JAPAN_1H_FINAL.mp4)
          echo "Duration: $DURATION"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=nw=1 SOULUME_EP05_JAPAN_1H_FINAL.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 SOULUME_EP05_JAPAN_1H_FINAL.mp4
          awk -v d="$DURATION" 'BEGIN { if (d < 3598 || d > 3602) exit 1; }'
          test -s SOULUME_EP05_JAPAN_1H_FINAL.mp4
          echo "QA PASS" >> qa.txt
          ls -lh SOULUME_EP05_JAPAN_1H_FINAL.mp4 SOULUME_EP05_JAPAN_THUMB.png

      - name: Publish production assets as release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='soulume-ep05-japan-20260923-v1'
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" SOULUME_EP05_JAPAN_1H_FINAL.mp4 SOULUME_EP05_JAPAN_THUMB.png qa.txt --repo "$GITHUB_REPOSITORY" --title 'SOULUME 05 — JAPAN — 1H FINAL' --notes 'Production-ready master and approved thumbnail for SOULUME Episode 05 Japan.'
