name: Render SOULUME EP05 Japan

on:
  push:
    paths:
      - '.github/workflows/render-soulume-ep05-20260923.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Decode approved thumbnail
        run: |
          base64 -d tmp/soulume_ep05_thumb_20260923.b64 > SOULUME_EP05_JAPAN_THUMB.jpg
          file SOULUME_EP05_JAPAN_THUMB.jpg

      - name: Download source chapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          cat > urls.txt <<'EOF'
https://gcdn.picsart.com/media-engine/a819b289-9cd0-4419-b562-689f2d3ea2c9.mp4
https://gcdn.picsart.com/media-engine/46440ca3-7390-404c-86da-7301dfa11acb.mp4
https://gcdn.picsart.com/media-engine/ffb407ff-b944-4e7b-b2af-3d9979529bb9.mp4
https://gcdn.picsart.com/media-engine/7654c995-9b2a-4470-b145-fdf7b039a700.mp4
https://gcdn.picsart.com/media-engine/baf6a8b2-beee-4321-93e8-4c941ae41ced.mp4
https://gcdn.picsart.com/media-engine/c4df1fb9-8aa5-445d-ae56-92894c61501b.mp4
https://gcdn.picsart.com/media-engine/6771525c-f865-4587-b9be-5c31aed1818b.mp4
https://gcdn.picsart.com/media-engine/5cd697ef-7057-43b0-ab3e-aafc8db236ee.mp4
https://gcdn.picsart.com/media-engine/181f5e81-0269-4e3a-9680-ea4fb2882410.mp4
https://gcdn.picsart.com/media-engine/9f70a5bb-f824-4ae8-a7ed-a5d889ebb3c8.mp4
https://gcdn.picsart.com/media-engine/fecf030b-3ed1-44b6-8e3e-8a3f69dacbd9.mp4
https://gcdn.picsart.com/media-engine/80325e5c-05fc-4b1b-8512-22cbece5f996.mp4
EOF
          i=1
          while IFS= read -r url; do
            printf -v n "%02d" "$i"
            echo "Downloading chapter $n"
            curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 "$url" -o "media/chapter_$n.mp4"
            i=$((i+1))
          done < urls.txt
          for f in media/*.mp4; do ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$f"; done

      - name: Build 60 minute master with SOULUME outro
        shell: bash
        run: |
          set -euo pipefail
          : > concat.txt
          for f in media/chapter_*.mp4; do echo "file '$PWD/$f'" >> concat.txt; done
          ffmpeg -y -f concat -safe 0 -i concat.txt -t 3600 \
            -vf "fps=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Japan stayed with me.':fontcolor=white:fontsize=52:borderw=1:bordercolor=black@0.35:x=(w-text_w)/2:y=h-170:enable='between(t,3580,3589.99)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Come with me to the next place ♡':fontcolor=white:fontsize=48:borderw=1:bordercolor=black@0.35:x=(w-text_w)/2:y=h-190:enable='between(t,3590,3599.99)',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='S.':fontcolor=white:fontsize=42:borderw=1:bordercolor=black@0.35:x=(w-text_w)/2:y=h-125:enable='between(t,3590,3599.99)'" \
            -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 48000 -movflags +faststart \
            SOULUME_EP05_JAPAN_1H_FINAL.mp4

      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format SOULUME_EP05_JAPAN_1H_FINAL.mp4 > qa.txt
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 SOULUME_EP05_JAPAN_1H_FINAL.mp4)
          echo "Duration: $DURATION"
          python - <<'PY'
import subprocess, sys
f='SOULUME_EP05_JAPAN_1H_FINAL.mp4'
d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nk=1:nw=1',f]).decode().strip())
if not (3598 <= d <= 3602):
    raise SystemExit(f'Bad duration: {d}')
streams=subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_type','-of','csv=p=0',f]).decode()
if 'video' not in streams or 'audio' not in streams:
    raise SystemExit('Missing audio or video stream')
print('QA PASS', d, streams)
PY
          ls -lh SOULUME_EP05_JAPAN_1H_FINAL.mp4 SOULUME_EP05_JAPAN_THUMB.jpg

      - name: Publish production assets as release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="soulume-ep05-japan-20260923-v1"
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" \
            SOULUME_EP05_JAPAN_1H_FINAL.mp4 \
            SOULUME_EP05_JAPAN_THUMB.jpg \
            qa.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SOULUME 05 — JAPAN — 1H FINAL" \
            --notes "Production assets for SOULUME Episode 05 Japan."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP05_JAPAN_FINAL
          path: |
            SOULUME_EP05_JAPAN_1H_FINAL.mp4
            SOULUME_EP05_JAPAN_THUMB.jpg
            qa.txt
          retention-days: 3
