name: SOULUME EP05 Adobe Transfer
on:
  push:
    paths:
      - '.github/workflows/soulume-ep05-adobe-transfer.yml'
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download final master
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            'https://github.com/izobilioner5/Love-time-/releases/download/soulume-ep05-japan-final/SOULUME_EP05_JAPAN_1H_FINAL.mp4' \
            -o final.mp4
          test "$(stat -c%s final.mp4)" = "1207790073"

      - name: Split into Adobe blocks
        run: |
          set -euo pipefail
          split -b 52428800 -d -a 2 final.mp4 block_
          test "$(find . -maxdepth 1 -name 'block_*' | wc -l)" = "24"

      - name: Upload blocks to Adobe
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://at.adobe.com/HCOxBLc0VHff7O6N"
            "https://at.adobe.com/1FsoPuSRhRfp5y9J"
            "https://at.adobe.com/UF9V2nmPbRgpnzGM"
            "https://at.adobe.com/lY3xW2FOb4DzS0wb"
            "https://at.adobe.com/7b08JjfBv607hPst"
            "https://at.adobe.com/cDPcw3WXixDJWtEt"
            "https://at.adobe.com/s22Fn31r0R44AnL8"
            "https://at.adobe.com/0BSzweFMRJJV5TVk"
            "https://at.adobe.com/VS33E8koo82F4gZH"
            "https://at.adobe.com/gsJ3wrMVp5BnPFvD"
            "https://at.adobe.com/z04tiH1izibcIp8C"
            "https://at.adobe.com/Aa8Ye6zMUwn8jNGf"
            "https://at.adobe.com/R0Ss3wSX9271GICC"
            "https://at.adobe.com/s93XpjuSKWSX7Q6Z"
            "https://at.adobe.com/LaL2seJTJ6nkCZFZ"
            "https://at.adobe.com/t85WeIPeLCuerpr1"
            "https://at.adobe.com/FuWu502zyj2abLIp"
            "https://at.adobe.com/L54hPyJHlWxmoOYo"
            "https://at.adobe.com/pVYPtaLBl7rqtxGM"
            "https://at.adobe.com/0CuatpgjHgigfrC4"
            "https://at.adobe.com/6vgklMuYYeYNAQ3j"
            "https://at.adobe.com/8sfKiJBUVvaaWmi5"
            "https://at.adobe.com/kwxAIZbeu6yG4zEk"
            "https://at.adobe.com/BbbDy0vjR6iYygAp"
          )
          mapfile -t parts < <(find . -maxdepth 1 -name 'block_*' | sort)
          test "${#parts[@]}" = "${#urls[@]}"
          for i in "${!parts[@]}"; do
            echo "Uploading block $((i+1))/24"
            curl -L --fail --retry 5 --retry-all-errors \
              -X PUT -H 'Content-Type: application/octet-stream' \
              --upload-file "${parts[$i]}" "${urls[$i]}"
          done
          echo "TRANSFER PASS"
