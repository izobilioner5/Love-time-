name: Upload SOULUME EP09 Macau thumbnail

on:
  push:
    branches:
      - soulume-ep09-render

permissions:
  contents: write

jobs:
  upload-thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download approved thumbnail
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o SOULUME_EP09_THUMBNAIL.jpg "https://at.adobe.com/LkdKmhnIpWhlwIHG"
          file SOULUME_EP09_THUMBNAIL.jpg
      - name: Add thumbnail to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: soulume-ep09-20260928
        run: |
          set -euxo pipefail
          gh release upload "$TAG" SOULUME_EP09_THUMBNAIL.jpg --repo "$GITHUB_REPOSITORY" --clobber
