name: Package SOULUME EP05 Final

on:
  push:
    paths:
      - '.github/workflows/package-soulume-ep05-20260923.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download final assets
        run: |
          curl -L --fail --retry 5 'https://github.com/izobilioner5/Love-time-/releases/download/soulume-ep05-japan-20260923-v1/SOULUME_EP05_JAPAN_1H_FINAL.mp4' -o SOULUME_EP05_JAPAN_1H_FINAL.mp4
          curl -L --fail --retry 5 'https://github.com/izobilioner5/Love-time-/releases/download/soulume-ep05-japan-20260923-v1/SOULUME_EP05_JAPAN_THUMB.png' -o SOULUME_EP05_JAPAN_THUMB.png
          ls -lh SOULUME_EP05_JAPAN_1H_FINAL.mp4 SOULUME_EP05_JAPAN_THUMB.png

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP05_JAPAN_FINAL
          path: |
            SOULUME_EP05_JAPAN_1H_FINAL.mp4
            SOULUME_EP05_JAPAN_THUMB.png
          compression-level: 0
          retention-days: 3
