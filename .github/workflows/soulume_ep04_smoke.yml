name: SOULUME Episode 04 FINAL 4K Render

on:
  push:
    branches:
      - soulume-ep04-render
    paths:
      - .github/workflows/soulume_ep04_smoke.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core curl

      - name: Prepare folders and font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/images work/clips work/notes out
          curl -L --fail --retry 3 "https://github.com/google/fonts/raw/main/ofl/caveat/Caveat%5Bwght%5D.ttf" -o work/Caveat.ttf
          test -s work/Caveat.ttf

      - name: Download visual sources
        shell: bash
        run: |
          set -euo pipefail
          urls=(
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0e41a29e-6d08-448c-acb5-d3fea847cd5c.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/434436fb-066e-459d-a0d1-28283024a166.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/39ce7b9d-e515-45aa-8f97-99190f95a976.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/59b772a5-07ee-437e-8e81-10ef6b0446f5.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/caa1d408-1253-4ba2-b501-753d0fe39391.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/6b5f1b33-b2bf-42a3-91fb-e50a33a5b94a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/60ba2c2e-8165-4d6a-8448-c9671fea5a1e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/09fe50b1-f95b-43c2-991b-b863be887f0d.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/787847e3-acff-4af1-8fa2-637d13313db0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e69c60c3-0d27-42d6-93ac-eb125efddb24.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/e9f580e9-99ea-4d5b-90f1-2e5b885ebb87.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5057cea3-da5d-4fc5-880d-a2baffa0cf53.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcb3654a-5c1e-4a8f-82d0-6a1343ecccd3.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/655dcd75-3fb4-43a3-b8a6-c5ecedfcbede.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/20e68842-f55d-45f4-8441-1340e93544c8.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/9c884ad0-4946-4619-9bae-35f9a9f19485.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/fcbfac25-6e90-4f4e-8d47-a7ce5aea63f6.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/28140912-a731-40e2-9c78-a38d5f14b7af.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c679bcbd-334c-4899-a23b-faadb68f417a.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/61407139-c615-4c76-9dcb-a3913349f6d9.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5cfb6402-fc93-4bd7-83b8-b1a18f9177a0.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/5f6a3fda-3d96-4ee1-ab3d-38e1ded3590e.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/f6730e47-441d-4ad6-bbff-16f8137999b7.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/0154d010-11db-40ac-8965-d73363e19b6b.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/807525a9-eb3f-4260-b3f8-e526999fab49.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/ad20f085-3e43-4b1c-bd17-cbedb17ff0b2.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/c02771d4-055c-41c3-947a-1c5ed8498e34.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/d98a9f50-151a-41c3-80f7-2f7cce356420.jpg"
          "https://cdn-ai-hs.picsart.com/ai-hot-storage/285a4147-0d25-48d4-9311-f6b59f4b4521.jpg"
          "https://images.pexels.com/photos/36620443/pexels-photo-36620443.jpeg?cs=srgb&dl=pexels-eclipse-chasers-716719984-36620443.jpg&fm=jpg"
          "https://images.pexels.com/photos/19733325/pexels-photo-19733325.jpeg?cs=srgb&dl=pexels-andromeda99-19733325.jpg&fm=jpg"
          "https://images.pexels.com/photos/20066249/pexels-photo-20066249.jpeg"
          )
          i=0
          for u in "${urls[@]}"; do
            printf -v fn "work/images/%02d.jpg" "$i"
            if ! curl -L --fail --retry 2 "$u" -o "$fn"; then
              cp work/images/00.jpg "$fn"
            fi
            test -s "$fn"
            i=$((i+1))
          done
          echo "Downloaded $i images"

      - name: Download music
        shell: bash
        run: |
          set -euo pipefail
          music=(
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_cbaf0946a21a2c31/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T134919Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_562c7c3d51587923/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135020Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_d6e9a419f9a1081c/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135058Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_a7664a20c5d671c5/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135240Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          "https://storage.googleapis.com/bgm-tracks-background-music-mcp/tracks/sess_fc8f91c242b68fe6/01.mp3?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=bgm-run-sa%40background-music-mcp.iam.gserviceaccount.com%2F20260922%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260922T135335Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
          )
          i=0
          for u in "${music[@]}"; do
            printf -v fn "work/music_%02d.mp3" "$i"
            curl -L --fail --retry 3 "$u" -o "$fn"
            test -s "$fn"
            i=$((i+1))
          done

      - name: Build music master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i work/music_00.mp3 -i work/music_01.mp3 -i work/music_02.mp3 -i work/music_03.mp3 -i work/music_04.mp3             -filter_complex "[0:a]loudnorm=I=-20:TP=-2:LRA=10[a0];[1:a]loudnorm=I=-20:TP=-2:LRA=10[a1];[2:a]loudnorm=I=-20:TP=-2:LRA=10[a2];[3:a]loudnorm=I=-20:TP=-2:LRA=10[a3];[4:a]loudnorm=I=-20:TP=-2:LRA=10[a4];[a0][a1]acrossfade=d=3[b1];[b1][a2]acrossfade=d=3[b2];[b2][a3]acrossfade=d=3[b3];[b3][a4]acrossfade=d=3[a]"             -map "[a]" -c:a aac -b:a 128k work/music_master.m4a

      - name: Render reusable clips
        shell: bash
        run: |
          set -euo pipefail
          render_one () {
            i="$1"
            printf -v img "work/images/%02d.jpg" "$i"
            printf -v out "work/clips/base_%02d.mp4" "$i"
            FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
            SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
            case $((i % 4)) in
              0) X="(in_w-out_w)*n/1439"; Y="(in_h-out_h)/2" ;;
              1) X="(in_w-out_w)*(1-n/1439)"; Y="(in_h-out_h)/2" ;;
              2) X="(in_w-out_w)/2"; Y="(in_h-out_h)*n/1439" ;;
              3) X="(in_w-out_w)/2"; Y="(in_h-out_h)*(1-n/1439)" ;;
            esac
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60               -vf "scale=4224:2376:force_original_aspect_ratio=increase,crop=3840:2160:x='${X}':y='${Y}',eq=saturation=1.03:contrast=1.01,drawtext=fontfile='${FONT}':text='SOULUME':fontcolor=white@0.78:fontsize=75:x=w-tw-108:y=84,drawtext=fontfile='${FONT}':text='NEW ZEALAND · EPISODE 04':fontcolor=white@0.72:fontsize=39:x=w-tw-108:y=183,drawtext=fontfile='${SCRIPT}':text='S.':fontcolor=white@0.80:fontsize=93:x=w-tw-108:y=258,format=yuv420p"               -an -c:v libx264 -preset ultrafast -crf 34 -maxrate 2200k -bufsize 4400k -g 24 -r 24 "$out"
          }
          export -f render_one
          export GITHUB_WORKSPACE
          seq 0 31 | xargs -P2 -I{} bash -c 'render_one "$1"' _ {}

      - name: Render note clips
        shell: bash
        run: |
          set -euo pipefail
          notes=(
          "The farther I went, the bigger the world became ♡"
          "Every turn opened another horizon"
          "The road kept making the map feel larger"
          "I came for a place. I found a whole world"
          "Some distances make you feel more alive"
          "One valley ended and another began"
          "I wanted to see what was beyond the next ridge"
          "New Zealand kept unfolding"
          "The world felt bigger here"
          "Freedom looked like an empty road"
          "Every horizon made me want to keep going"
          "I stopped asking how far"
          "Another lake. Another reason to stay curious"
          "The mountains made the day feel enormous"
          "I followed the road without needing the answer"
          "Some places expand you quietly"
          "The weather changed and the landscape opened again"
          "I kept finding more than I expected"
          "The farther south I went, the wider everything felt"
          "I wanted to photograph the scale, not just the view"
          "There was always another road"
          "I think this is what freedom looks like"
          "The map was smaller than the feeling"
          "I do not think the world is meant to feel small"
          )
          for j in $(seq 0 23); do
            imgidx=$(( (j*7 + 3) % 32 ))
            printf -v img "work/images/%02d.jpg" "$imgidx"
            printf -v out "work/notes/note_%02d.mp4" "$j"
            txt="${notes[$j]}"
            FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
            SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
            if [ $((j%2)) -eq 0 ]; then NX=126; NY=1830; else NX=126; NY=258; fi
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i "$img" -t 60               -vf "scale=4224:2376:force_original_aspect_ratio=increase,crop=3840:2160:x='(in_w-out_w)*n/1439':y='(in_h-out_h)/2',eq=saturation=1.03:contrast=1.01,drawtext=fontfile='${FONT}':text='SOULUME':fontcolor=white@0.78:fontsize=75:x=w-tw-108:y=84,drawtext=fontfile='${FONT}':text='NEW ZEALAND · EPISODE 04':fontcolor=white@0.72:fontsize=39:x=w-tw-108:y=183,drawtext=fontfile='${SCRIPT}':text='S.':fontcolor=white@0.80:fontsize=93:x=w-tw-108:y=258,drawtext=fontfile='${SCRIPT}':text='${txt}':fontcolor=white@0.86:fontsize=108:x=${NX}:y=${NY}:enable='between(t,22,38)',format=yuv420p"               -an -c:v libx264 -preset ultrafast -crf 34 -maxrate 2200k -bufsize 4400k -g 24 -r 24 "$out"
          done

      - name: Render fixed 20-second outro
        shell: bash
        run: |
          set -euo pipefail
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          SCRIPT="$GITHUB_WORKSPACE/work/Caveat.ttf"
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i work/images/11.jpg -t 20 \
            -vf "scale=4224:2376:force_original_aspect_ratio=increase,crop=3840:2160,eq=saturation=1.03:contrast=1.01,drawbox=x=0:y=0:w=iw:h=ih:color=black@0.32:t=fill,drawtext=fontfile='${FONT}':text='There is still so much more to see.':fontcolor=white@0.92:fontsize=92:x=(w-tw)/2:y=(h-th)/2-80:enable='between(t,0,6.7)',drawtext=fontfile='${FONT}':text='Come with me to the next place ♡':fontcolor=white@0.92:fontsize=86:x=(w-tw)/2:y=(h-th)/2-80:enable='between(t,6.7,13.4)',drawtext=fontfile='${SCRIPT}':text='S.':fontcolor=white@0.94:fontsize=150:x=(w-tw)/2:y=(h-th)/2-40:enable='between(t,13.4,20)',format=yuv420p" \
            -an -c:v libx264 -preset ultrafast -crf 34 -maxrate 2200k -bufsize 4400k -g 24 -r 24 work/outro20.mp4

      - name: Build exact 5h55m55s sequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import random
          random.seed(404)
          note_slots={14+15*k:k for k in range(23)}
          note_slots[344]=23
          bag=[]
          items=[]
          for slot in range(355):
              if slot in note_slots:
                  items.append(f"notes/note_{note_slots[slot]:02d}.mp4")
              else:
                  if not bag:
                      bag=list(range(32)); random.shuffle(bag)
                  items.append(f"clips/base_{bag.pop():02d}.mp4")
          with open("work/sequence.txt","w") as f:
              for p in items:
                  f.write(f"file '{p}'\n")
          PY
          ffmpeg -hide_banner -loglevel error -y -i work/clips/base_00.mp4 -t 35 -c copy work/last35.mp4
          echo "file 'last35.mp4'" >> work/sequence.txt
          cd work
          echo "file 'outro20.mp4'" >> sequence.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i sequence.txt -c copy video_only.mp4
          cd ..

      - name: Mux audio and verify master
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i work/video_only.mp4 -stream_loop -1 -i work/music_master.m4a             -t 21355 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k -af "afade=t=in:st=0:d=2,afade=t=out:st=21345:d=10" -shortest             out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 -t 60 -c copy out/SOULUME_EP04_PREVIEW_60S.mp4
          ffprobe -v error -show_streams -show_format -of json out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 > out/ffprobe.json
          python3 - <<'PY'
          import json, os
          d=json.load(open("out/ffprobe.json"))
          dur=float(d["format"]["duration"])
          streams=d["streams"]
          assert abs(dur-21355) < 1.1, dur
          assert any(s["codec_type"]=="video" for s in streams)
          assert any(s["codec_type"]=="audio" for s in streams)
          v=next(s for s in streams if s["codec_type"]=="video")
          assert int(v["width"])==3840 and int(v["height"])==2160
          print("VERIFIED 4K MASTER",dur,os.path.getsize("out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4"))
          PY

      - name: Audio continuity QA
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -i out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 -af silencedetect=noise=-50dB:d=8 -f null - 2> out/silence.log || true
          ffmpeg -hide_banner -i out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4 -af volumedetect -f null - 2> out/volume.log || true
          grep -E "mean_volume|max_volume" out/volume.log || true

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_PREVIEW_60S
          path: out/SOULUME_EP04_PREVIEW_60S.mp4
          compression-level: 0
          retention-days: 3

      - name: Upload full master
        uses: actions/upload-artifact@v4
        with:
          name: SOULUME_EP04_NEW_ZEALAND_5H55M55S
          path: |
            out/SOULUME_EP04_NEW_ZEALAND_5H55M55S.mp4
            out/ffprobe.json
            out/silence.log
            out/volume.log
          compression-level: 0
          retention-days: 3
